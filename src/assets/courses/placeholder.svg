<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700">
  <defs>
    <pattern id="checkerboard" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#f5f5f5"/>
      <rect width="40" height="40" fill="#e5e5e5"/>
      <rect x="40" y="40" width="40" height="40" fill="#e5e5e5"/>
    </pattern>
  </defs>
  <rect width="600" height="700" fill="url(#checkerboard)"/>
</svg>
